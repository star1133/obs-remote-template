<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube to OBS</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><img src="icon.png" alt=""><b>YouTube to OBS</b></header>
<label class="sw"><input id="on" type="checkbox"><span>Send the playing video to OBS</span></label>
<p id="link" class="row"></p>
<p id="now" class="row"></p>
<p id="obs" class="row dim"></p>
<p class="dim small">In OBS, open the OBS Remote dock and press <b>Add to OBS</b> once. Whichever YouTube tab you play last is the one OBS shows.</p>
<script src="popup.js"></script>
</body>
</html>
